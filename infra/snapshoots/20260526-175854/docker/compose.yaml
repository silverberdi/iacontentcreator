name: local-ai-stack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.21.7
    restart: unless-stopped
    ports:
      - "${N8N_BIND_IP}:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/silverman/compartido_mac:/home/node/.n8n-files
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    # Qdrant es interno: n8n accede por http://qdrant:6333 en la red backend.
    # No se publica 6333/6334 en el host ni en la LAN.
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_CONSOLE_BIND_IP}:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [backend]

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    ports:
      - "${PORTAINER_BIND_IP}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [frontend]

networks:
  frontend:
  backend:

volumes:
  postgres_data:
  n8n_data:
  qdrant_data:
  minio_data:
  portainer_data:
