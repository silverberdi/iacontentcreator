services:
  local-visual-qa:
    build:
      context: ./infra/local-visual-qa
    restart: unless-stopped
    environment:
      PORT: 8096
      LOCAL_VISUAL_QA_MIN_PERSON_CONFIDENCE: 0.45
      LOCAL_VISUAL_QA_MIN_HAND_CONFIDENCE: 0.45
      LOCAL_VISUAL_QA_STRICTNESS: strict
    expose:
      - "8096"
